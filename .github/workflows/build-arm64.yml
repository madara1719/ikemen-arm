name: Build Ikemen GO (Linux ARM64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ikemen tree to compile"
        default: develop

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: clone ikemen
        uses: actions/checkout@v4
        with:
          repository: ikemen-engine/Ikemen-GO
          ref: ${{ inputs.ref }}

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config make nasm yasm build-essential \
            libxmp-dev libsdl2-dev \
            libgl1-mesa-dev libasound2-dev

      - name: compile 
        run: ./build/build.sh LinuxARM

      - name: see binaries
        run: |
          ls -lh bin/
          file bin/Ikemen_GO_* || true

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: Ikemen_GO_LinuxARM
          path: |
            bin/Ikemen_GO_*
            data
            external
            font
          if-no-files-found: warn
