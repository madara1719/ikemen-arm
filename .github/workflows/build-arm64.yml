name: Build Ikemen GO (Linux ARM64)

# Se lanza a mano desde la pestaña Actions. No hace falta hacer fork:
# este workflow clona directamente el repo oficial de Ikemen GO.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o tag de Ikemen-GO a compilar (develop, v1.0.0, ...)"
        default: develop

jobs:
  build:
    # Runner ARM64 nativo (gratis en repos públicos), sin cross-compilar
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clonar Ikemen GO
        uses: actions/checkout@v4
        with:
          repository: ikemen-engine/Ikemen-GO
          ref: ${{ inputs.ref }}

      - name: Instalar Go (la versión que pida el proyecto)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config make nasm yasm build-essential \
            libxmp-dev libsdl2-dev \
            libgtk-3-dev libgl1-mesa-dev libasound2-dev libopenal-dev

      - name: Compilar (esto incluye compilar FFmpeg)
        run: ./build/build.sh LinuxARM

      - name: Localizar el binario y preparar el paquete
        run: |
          echo "== Ejecutables ELF grandes generados =="
          find . -type f -size +5M -not -path './.git/*' -exec file {} + | grep -i 'ELF' || true

          BIN=$(find . -type f -name 'Ikemen_GO_LinuxARM*' -not -path './.git/*' | head -n1)
          if [ -z "$BIN" ]; then
            echo "No encontré Ikemen_GO_LinuxARM; mira la lista de arriba"
            exit 1
          fi
          echo "Binario: $BIN"

          mkdir -p dist
          cp "$BIN" dist/Ikemen_GO_LinuxARM
          for d in data external font; do
            [ -d "$d" ] && cp -r "$d" dist/ || true
          done
          ls -lh dist/

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Ikemen_GO_LinuxARM
          path: dist
          if-no-files-found: error
